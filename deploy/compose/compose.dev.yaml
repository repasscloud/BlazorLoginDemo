name: cinturon360-dev

services:
  postgres:
    image: postgres:18-alpine3.22
    restart: unless-stopped
    environment:
      POSTGRES_USER: cinturon
      POSTGRES_PASSWORD: cinturon_dev_password
      POSTGRES_DB: cinturon360
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinturon -d cinturon360"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=cinturon360;Username=cinturon;Password=cinturon_dev_password"
      MailerSend__ApiToken: "${MAILERSEND_API_TOKEN:-}"
      MailerSend__FromEmail: "${MAILERSEND_FROM_EMAIL:-}"
      MailerSend__FromName: "${MAILERSEND_FROM_NAME:-Cinturon360 Dev}"
      Stripe__SecretKey: "${STRIPE_SECRET_KEY:-}"
      Stripe__PublishableKey: "${STRIPE_PUBLISHABLE_KEY:-}"
      Stripe__WebhookSecret: "${STRIPE_WEBHOOK_SECRET:-}"
      Storage__BucketName: "${R2_BUCKET_NAME:-}"
      Storage__Endpoint: "${R2_ENDPOINT:-}"
      Storage__AccessKeyId: "${R2_ACCESS_KEY_ID:-}"
      Storage__SecretAccessKey: "${R2_SECRET_ACCESS_KEY:-}"
      Storage__PublicBaseUrl: "${R2_PUBLIC_BASE_URL:-}"
    ports:
      - "5100:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.web
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Api__BaseUrl: "http://api:8080"
      DP_KEYS_PATH: "/app/dp-keys"
    ports:
      - "5001:8080"
    volumes:
      - web_dp_keys:/app/dp-keys
    depends_on:
      - api

  jobs:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.jobs
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=cinturon360;Username=cinturon;Password=cinturon_dev_password"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  web_dp_keys:
