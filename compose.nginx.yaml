  crontab:
    build:
      context: ./.docker/cron
      dockerfile: Dockerfile
      args:
        TARGETARCH: arm64
    platform: linux/arm64
    container_name: crontab
    depends_on:
      - api
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,size=8m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  tmp-cleaner:
    image: busybox:1.36
    container_name: tmp-cleaner
    depends_on:
      - api
    restart: unless-stopped
    command:
      - sh
      - -lc
      - |
        while true; do
          find /sharedtmp -maxdepth 1 -type f -name 'ASPNETCORE_*' -mmin +120 -exec rm -f {} \;
          sleep 3600
        done
    volumes:
      - sharedtmp:/sharedtmp

  docs:
    build:
      context: ./Cinturon360.Docs
      dockerfile: ../Dockerfile.docs
    image: cinturon360-docs:static
    container_name: docs
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./.docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - blazor
      - api
      - pgadmin
      - pgweb
      - docs

volumes:
  postgresql-data:
  pgadmin-data:
  web-dataprotection:
  api-dataprotection:
  sharedtmp:
  docsy_node_modules:
  docsy_go_cache:
  docsy_hugo_cache:
