<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Organization Picker – Reference</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons (for error icon parity) -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">
</head>
<body class="bg-light">

<!-- Modal (forced visible for reference) -->
<div class="modal fade show" style="display:block;" tabindex="-1" aria-modal="true" role="dialog">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
        <div class="modal-content">

            <!-- Header -->
            <div class="modal-header">
                <h5 class="modal-title mb-0">Select Organization</h5>
                <button type="button" class="btn-close" aria-label="Close"></button>
            </div>

            <!-- Body -->
            <div class="modal-body">

                <!-- Error example (remove if not needed) -->
                <div class="alert alert-danger d-flex align-items-center" role="alert">
                    <i class="bi bi-x-circle-fill fs-5 me-2"></i>
                    <div>Something went wrong loading organizations.</div>
                </div>

                <!-- Search / filters -->
                <div class="row g-3 align-items-end mb-3">

                    <!-- Search -->
                    <div class="col-12 col-lg-6">
                        <label class="form-label" for="orgSearch">Search (any field)</label>
                        <input
                            id="orgSearch"
                            type="text"
                            class="form-control"
                            placeholder="Start typing…">
                    </div>

                    <!-- Type filter -->
                    <div class="col-auto">
                        <label class="form-label" for="orgType">Type</label>
                        <select id="orgType" class="form-select">
                            <option selected>All types</option>
                            <option>Vendor</option>
                            <option>TMC</option>
                            <option>Client</option>
                        </select>
                    </div>

                    <!-- Clear -->
                    <div class="col-auto d-grid">
                        <label class="form-label d-block">&nbsp;</label>
                        <button class="btn btn-outline-secondary">
                            Clear
                        </button>
                    </div>

                    <!-- Page size -->
                    <div class="col-12 col-lg-auto ms-lg-auto text-lg-end">
                        <label class="form-label me-2">Page size</label>
                        <select class="form-select d-inline-block" style="width: 6.5rem">
                            <option>10</option>
                            <option selected>20</option>
                            <option>50</option>
                            <option>100</option>
                        </select>
                    </div>
                </div>

                <!-- Results -->
                <div class="list-group">

                    <!-- Result row -->
                    <div class="list-group-item d-flex justify-content-between align-items-center">
                        <div class="me-3">
                            <div>
                                <strong>Globex Corporation</strong>
                                <span class="text-muted"> AU</span>
                                <span class="text-muted"> Active</span>
                                <code class="ms-2">org_7F9A2KX3</code>
                            </div>
                        </div>
                        <button class="btn btn-sm btn-outline-primary">
                            Assign
                        </button>
                    </div>

                    <div class="list-group-item d-flex justify-content-between align-items-center">
                        <div class="me-3">
                            <div>
                                <strong>Initech Pty Ltd</strong>
                                <span class="text-muted"> US</span>
                                <span class="text-muted"> Inactive</span>
                                <code class="ms-2">org_1Q9D0M8Z</code>
                            </div>
                        </div>
                        <button class="btn btn-sm btn-outline-primary">
                            Assign
                        </button>
                    </div>

                    <div class="list-group-item d-flex justify-content-between align-items-center">
                        <div class="me-3">
                            <div>
                                <strong>Umbrella Travel Group</strong>
                                <span class="text-muted"> GB</span>
                                <span class="text-muted"> Active</span>
                                <code class="ms-2">org_L8P2A6WQ</code>
                            </div>
                        </div>
                        <button class="btn btn-sm btn-outline-primary">
                            Assign
                        </button>
                    </div>

                </div>

                <!-- Pagination -->
                <nav class="mt-3" aria-label="Org picker pagination">
                    <ul class="pagination mb-0 justify-content-center">
                        <li class="page-item disabled">
                            <button class="page-link">Previous</button>
                        </li>
                        <li class="page-item active">
                            <button class="page-link">1</button>
                        </li>
                        <li class="page-item">
                            <button class="page-link">2</button>
                        </li>
                        <li class="page-item">
                            <button class="page-link">3</button>
                        </li>
                        <li class="page-item">
                            <button class="page-link">Next</button>
                        </li>
                    </ul>
                </nav>

            </div>

            <!-- Footer -->
            <div class="modal-footer d-flex justify-content-end gap-2" style="border-top:0;">
                <button class="btn btn-outline-secondary">Close</button>
            </div>

        </div>
    </div>
</div>

<!-- Backdrop -->
<div class="modal-backdrop fade show"></div>

</body>
</html>
