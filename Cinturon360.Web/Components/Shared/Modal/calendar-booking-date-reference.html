<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Weekday Date Picker – Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

  <style>
    body { background:#f8f9fa; }

    .demo-card {
      max-width: 640px;
      margin: 60px auto;
    }

    .calendar-hint {
      font-size:.85rem;
    }
  </style>
</head>

<body>

<div class="container">
  <div class="card shadow-sm demo-card">
    <div class="card-body">

      <h5 class="card-title mb-3">Weekday Date Picker (Pure HTML Demo)</h5>

      <!-- SETTINGS PANEL (simulates your Blazor parameters) -->
      <div class="row g-3 mb-4">

        <div class="col-md-4">
          <label class="form-label">Minimum days from today</label>
          <input type="number"
                 id="minDays"
                 class="form-control"
                 value="0"
                 min="0"
                 max="365">
        </div>

        <div class="col-md-4 d-flex align-items-end">
          <div class="form-check">
            <input class="form-check-input"
                   type="checkbox"
                   id="disableSat"
                   checked>
            <label class="form-check-label">
              Disable Saturday
            </label>
          </div>
        </div>

        <div class="col-md-4 d-flex align-items-end">
          <div class="form-check">
            <input class="form-check-input"
                   type="checkbox"
                   id="disableSun"
                   checked>
            <label class="form-check-label">
              Disable Sunday
            </label>
          </div>
        </div>

      </div>

      <!-- DATE INPUT (equivalent of InputDate) -->
      <div class="mb-2">
        <label class="form-label">Select Date</label>
        <input type="date"
               id="dateInput"
               class="form-control">
      </div>

      <div id="msg" class="form-text calendar-hint"></div>

      <hr class="my-4">

      <div>
        <div class="text-muted small mb-1">Selected Date</div>
        <div class="fw-semibold" id="selectedOutput">None</div>
      </div>

    </div>
  </div>
</div>

<script>
(function () {

  const dateInput   = document.getElementById("dateInput");
  const minDaysBox  = document.getElementById("minDays");
  const disableSat  = document.getElementById("disableSat");
  const disableSun  = document.getElementById("disableSun");
  const msg         = document.getElementById("msg");
  const output      = document.getElementById("selectedOutput");

  function toDateString(date) {
    return date.toISOString().split("T")[0];
  }

  function todayUtc() {
    const d = new Date();
    return new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  }

  function updateMinDate() {
    const minDays = parseInt(minDaysBox.value || "0", 10);
    const base = todayUtc();
    base.setUTCDate(base.getUTCDate() + minDays);

    const minStr = toDateString(base);
    dateInput.min = minStr;

    return base;
  }

  function isDisabledDay(date) {
    const day = date.getUTCDay(); // 0 Sun, 6 Sat

    if (disableSat.checked && day === 6) return true;
    if (disableSun.checked && day === 0) return true;

    return false;
  }

  function validateSelectedDate() {

    if (!dateInput.value) {
      msg.textContent = "";
      output.textContent = "None";
      return;
    }

    const selected = new Date(dateInput.value + "T00:00:00Z");
    const minBase  = updateMinDate();

    if (selected < minBase) {
      msg.textContent = "Selected date is before the allowed minimum.";
      dateInput.value = "";
      output.textContent = "None";
      return;
    }

    if (isDisabledDay(selected)) {
      msg.textContent = "That weekday is disabled.";
      dateInput.value = "";
      output.textContent = "None";
      return;
    }

    msg.textContent = "";
    output.textContent = dateInput.value;
  }

  function refreshAll() {
    updateMinDate();
    validateSelectedDate();
  }

  // EVENTS
  dateInput.addEventListener("change", validateSelectedDate);
  minDaysBox.addEventListener("input", refreshAll);
  disableSat.addEventListener("change", validateSelectedDate);
  disableSun.addEventListener("change", validateSelectedDate);

  // INIT
  refreshAll();

})();
</script>

</body>
</html>
