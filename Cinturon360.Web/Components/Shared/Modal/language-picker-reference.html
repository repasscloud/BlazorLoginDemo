<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Culture Picker – Reference</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap 5 -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

  <style>
    body {
      background:#f8f9fa;
    }

    .demo-card {
      max-width: 520px;
      margin: 80px auto;
    }

    .form-select-sm {
      font-size: .9rem;
    }

    .preview-box {
      background:white;
      border-radius:.5rem;
      border:1px solid #dee2e6;
      padding:1rem;
    }
  </style>
</head>

<body>

<div class="container">
  <div class="card shadow-sm demo-card">
    <div class="card-body">

      <h5 class="card-title mb-3">
        Preferred Language / Culture
      </h5>

      <p class="text-muted small mb-3">
        Pure HTML preview of the Blazor culture selector.  
        No server logic — this is visual only.
      </p>

      <div class="preview-box">

        <!-- CULTURE SELECT (visual equivalent of your Razor component) -->
        <select id="cultureSelect"
                class="form-select form-select-sm w-auto d-inline-block">

          <option value="en-AU" selected>
            🇦🇺 English
          </option>

          <option value="en-GB">
            🇬🇧 English
          </option>

          <option value="es-ES">
            🇪🇸 Español
          </option>

          <option value="it-IT">
            🇮🇹 Italiano
          </option>

          <option value="fr-FR">
            🇫🇷 Français
          </option>

        </select>

      </div>

      <!-- Demo output -->
      <div class="mt-4">

        <div class="text-muted small mb-1">
          Selected Culture
        </div>

        <div class="fw-semibold" id="currentCulture">
          en-AU
        </div>

      </div>

    </div>
  </div>
</div>

<script>
  // PURELY FOR DEMO VISUAL FEEDBACK
  // (Your real Blazor version would do DB + cookie + refresh)

  const select = document.getElementById("cultureSelect");
  const output = document.getElementById("currentCulture");

  select.addEventListener("change", e => {
    output.textContent = e.target.value;
  });
</script>

</body>
</html>
