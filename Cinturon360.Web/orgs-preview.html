<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Organizations</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5.3.x -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            padding: 2rem;
            background-color: #f8f9fa;
        }
        .card-container {
            background: white;
            padding: 2rem;
            border-radius: 0.75rem;
            box-shadow: 0 0.25rem 1rem rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="card-container">

        <div class="d-flex align-items-center justify-content-between mb-4">
            <h2 class="mb-0">Organizations</h2>
            <button class="btn btn-primary">
                New Organization
            </button>
        </div>

        <div class="row mb-3">
            <div class="col-md-6">
                <input id="searchBox"
                       class="form-control"
                       placeholder="Search organizations...">
            </div>
        </div>

        <div class="small text-muted mb-2">
            Showing <span id="resultCount"></span>
        </div>

        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                    <tr>
                        <th>Name</th>
                        <th>Type</th>
                        <th>Sector</th>
                        <th class="text-end"></th>
                    </tr>
                </thead>
                <tbody id="orgTableBody">
                </tbody>
            </table>
        </div>

    </div>
</div>

<script>
    const organizations = [
        {
            id: "1",
            name: "Acme Travel",
            type: "TMC",
            sector: "Corporate",
            address: "1 King William Street",
            city: "Adelaide",
            email: "contact@acme.com",
            phone: "0400000001"
        },
        {
            id: "2",
            name: "Global Tours",
            type: "Agency",
            sector: "Leisure",
            address: "100 Collins Street",
            city: "Melbourne",
            email: "info@globaltours.com",
            phone: "0400000002"
        },
        {
            id: "3",
            name: "Sky Corporate",
            type: "Enterprise",
            sector: "Corporate",
            address: "200 George Street",
            city: "Sydney",
            email: "admin@skycorp.com",
            phone: "0400000003"
        },
        {
            id: "4",
            name: "Northern Travel",
            type: "TMC",
            sector: "Mining",
            address: "50 Queen Street",
            city: "Brisbane",
            email: "support@northern.com",
            phone: "0400000004"
        },
        {
            id: "5",
            name: "Outback Logistics",
            type: "Enterprise",
            sector: "Government",
            address: "12 King Road",
            city: "Perth",
            email: "admin@outback.com",
            phone: "0400000005"
        }
    ];

    const tableBody = document.getElementById("orgTableBody");
    const resultCount = document.getElementById("resultCount");
    const searchBox = document.getElementById("searchBox");

    function renderTable(data) {
        tableBody.innerHTML = "";

        if (data.length === 0) {
            tableBody.innerHTML = `
                <tr>
                    <td colspan="4" class="text-center text-muted">
                        No organizations match your search.
                    </td>
                </tr>
            `;
        } else {
            data.forEach(o => {
                const row = `
                    <tr>
                        <td>${o.name}</td>
                        <td>${o.type}</td>
                        <td>${o.sector}</td>
                        <td class="text-end">
                            <button class="btn btn-sm btn-outline-primary">
                                View
                            </button>
                        </td>
                    </tr>
                `;
                tableBody.insertAdjacentHTML("beforeend", row);
            });
        }

        resultCount.textContent = `${data.length} of ${organizations.length}`;
    }

    function matchesSearch(org, search) {
        const s = search.toLowerCase().trim();

        return (
            org.name.toLowerCase().includes(s) ||
            org.type.toLowerCase().includes(s) ||
            org.sector.toLowerCase().includes(s) ||
            org.address.toLowerCase().includes(s) ||
            org.city.toLowerCase().includes(s) ||
            org.email.toLowerCase().includes(s) ||
            org.phone.toLowerCase().includes(s)
        );
    }

    // 1-second debounce
    let debounceTimer;
    searchBox.addEventListener("input", function () {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => {
            const searchValue = searchBox.value;

            if (!searchValue.trim()) {
                renderTable(organizations);
                return;
            }

            const filtered = organizations.filter(o => matchesSearch(o, searchValue));
            renderTable(filtered);

        }, 1000);
    });

    // initial render
    renderTable(organizations);
</script>

</body>
</html>
