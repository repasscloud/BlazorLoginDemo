<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Travel Policy — Demo</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body {
    background-color: #f4f6f9;
}

.page-container {
    max-width: 1400px;
}

.card {
    border: none;
}

.card-header {
    background-color: #fff;
    border-bottom: 1px solid #e9ecef;
}

.form-label {
    font-weight: 500;
}

.header-bar {
    background: #ffffff;
    border-bottom: 1px solid #dee2e6;
    padding: 16px 24px;
    margin-bottom: 24px;
}

.multi-select {
    height: 220px;
}

</style>

</head>
<body>

<div class="header-bar">

<div class="container-fluid page-container">

<div class="d-flex justify-content-between align-items-center">

<h4 class="mb-0">New Travel Policy</h4>

<div class="btn-group">

<button class="btn btn-outline-secondary">
Cancel
</button>

<button class="btn btn-primary">
Save
</button>

</div>

</div>

</div>

</div>

<div class="container-fluid page-container">

<!-- Identity Card -->
<div class="card shadow-sm mb-4">

<div class="card-header">
<small class="text-muted">Acme Travel Sydney Pty Ltd</small>
</div>

<div class="card-body">

<div class="row g-3">

<div class="col-md-6">

<label class="form-label">
Policy Name
</label>

<input class="form-control" value="Standard Corporate Travel Policy">

</div>

<div class="col-md-3">

<label class="form-label">
Policy Currency
</label>

<select class="form-select">

<option selected>AUD — Australian Dollar</option>
<option>USD — US Dollar</option>
<option>EUR — Euro</option>

</select>

</div>

<div class="col-md-3">

<label class="form-label">
Org Id
</label>

<input class="form-control bg-light" value="org_01HZYK3QJ9X8P7M6R5T4" readonly>

</div>

</div>

</div>

</div>


<!-- Geographic Scope -->
<div class="card shadow-sm mb-4">

<div class="card-header">
<h6 class="mb-0">Geographic Scope</h6>
</div>

<div class="card-body">

<div class="row g-4">

<!-- Regions -->
<div class="col-md-4">

<label class="form-label">
Enabled Regions
</label>

<select class="form-select multi-select" multiple>

<option selected>Australia & New Zealand</option>
<option selected>Asia Pacific</option>
<option>Europe</option>
<option>North America</option>
<option>South America</option>
<option>Africa</option>

</select>

</div>


<!-- Continents -->
<div class="col-md-4">

<label class="form-label">
Enabled Continents
</label>

<select class="form-select multi-select" multiple>

<option selected>Oceania</option>
<option selected>Asia</option>
<option>Europe</option>
<option>North America</option>
<option>South America</option>
<option>Africa</option>

</select>

</div>


<!-- Countries -->
<div class="col-md-4">

<label class="form-label">
Enabled Countries
</label>

<select class="form-select multi-select" multiple>

<option selected>Australia</option>
<option selected>New Zealand</option>
<option>Singapore</option>
<option>Japan</option>
<option>United Kingdom</option>
<option>United States</option>

</select>

</div>

</div>

</div>

</div>


<!-- Preview Card -->
<div class="card shadow-sm">

<div class="card-header">
<h6 class="mb-0">Policy Summary (Preview)</h6>
</div>

<div class="card-body">

<table class="table">

<tr>
<td width="250"><strong>Policy Name</strong></td>
<td>Standard Corporate Travel Policy</td>
</tr>

<tr>
<td><strong>Currency</strong></td>
<td>AUD — Australian Dollar</td>
</tr>

<tr>
<td><strong>Geographic Coverage</strong></td>
<td>Australia, New Zealand, Asia Pacific</td>
</tr>

<tr>
<td><strong>Status</strong></td>
<td><span class="badge bg-success">Draft</span></td>
</tr>

</table>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
