<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Access Denied</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet" />

  <style>
    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco,
                   Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 0.85rem;
    }
  </style>
</head>
<body class="bg-light">

  <main class="container d-flex align-items-center justify-content-center"
        style="min-height: 100vh;">
    <div class="col-md-7 col-lg-6">

      <div class="card shadow-sm border-danger">
        <div class="card-body text-center p-4">

          <div class="mb-3 text-danger">
            <i class="bi bi-shield-lock-fill fs-1"></i>
          </div>

          <h1 class="h4 mb-2">Access denied</h1>

          <p class="text-muted mb-3">
            You’re signed in, but your account doesn’t have permission to
            access this area.
          </p>

          <div class="mono text-muted mb-4">
            HTTP 403 · Policy restricted
          </div>

          <div class="alert alert-light text-start small mb-4">
            <strong>What you can do:</strong>
            <ul class="mb-0">
              <li>Return to your dashboard</li>
              <li>Contact an administrator for access</li>
              <li>Log a support request if you believe this is an error</li>
            </ul>
          </div>

          <div class="d-flex justify-content-center gap-2">
            <a href="/" class="btn btn-outline-secondary">
              Back to dashboard
            </a>
            <button class="btn btn-danger">
              Log support request
            </button>
          </div>

        </div>
      </div>

    </div>
  </main>

  <!-- Bootstrap Icons -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</body>
</html>
