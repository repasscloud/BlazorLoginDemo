<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Loading Overlay – Sponsored</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet" />

  <style>
    /* ===============================
       Fullscreen overlay
       =============================== */
    .loading-overlay {
      position: fixed;
      inset: 0;
      z-index: 2000;
      background: linear-gradient(
        180deg,
        rgba(245, 247, 250, 0.95),
        rgba(230, 233, 239, 0.95)
      );
      backdrop-filter: blur(3px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .loading-shell {
      width: 100%;
      max-width: 820px;
      padding: 1.5rem;
    }

    /* ===============================
       Card
       =============================== */
    .loading-card {
      border-radius: 1rem;
      border: none;
      overflow: hidden;
    }

    .loading-header {
      background: linear-gradient(135deg, #0d6efd, #3b82f6);
      color: #fff;
      padding: 1rem 1.25rem;
    }

    .loading-header h1 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 600;
    }

    .loading-body {
      padding: 1.25rem;
    }

    /* ===============================
       Spinner + status
       =============================== */
    .spinner-wrap {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .status-text {
      font-size: 0.95rem;
      color: #495057;
    }

    /* ===============================
       Ad container
       =============================== */
    .ad-frame {
      border: 1px dashed #ced4da;
      border-radius: 0.75rem;
      background: #fff;
      padding: 0.75rem;
    }

    .ad-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #6c757d;
      margin-bottom: 0.25rem;
    }

    /* Standard IAB sizes for travel platforms */
    .ad-banner {
      width: 728px;
      max-width: 100%;
      height: 90px;
      object-fit: cover;
      border-radius: 0.5rem;
      background: #e9ecef;
    }

    .ad-rectangle {
      width: 300px;
      max-width: 100%;
      height: 250px;
      object-fit: cover;
      border-radius: 0.5rem;
      background: #e9ecef;
    }

    /* ===============================
       Footer
       =============================== */
    .loading-footer {
      background: #f8f9fa;
      padding: 0.75rem 1.25rem;
      font-size: 0.8rem;
      color: #6c757d;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco,
                   Consolas, "Liberation Mono", "Courier New", monospace;
    }

    /* ===============================
       Fade animation
       =============================== */
    .ad {
      display: none;
      animation: fadeIn 0.5s ease forwards;
    }

    .ad.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="bg-light">

  <!-- Loading Overlay -->
  <div class="loading-overlay">
    <div class="loading-shell">

      <div class="card shadow loading-card">

        <!-- Header -->
        <div class="loading-header">
          <h1>Finalising Travel Configuration</h1>
        </div>

        <!-- Body -->
        <div class="loading-body">

          <!-- Spinner -->
          <div class="spinner-wrap">
            <div class="spinner-border text-primary"
                 style="width: 2.5rem; height: 2.5rem;"
                 role="status">
              <span class="visually-hidden">Loading…</span>
            </div>

            <div class="status-text">
              Applying policies, preferred suppliers, and compliance checks…
            </div>
          </div>

          <!-- Ads -->
          <div class="ad-frame">

            <div class="ad-label">Sponsored</div>

            <!-- Leaderboard banner (728x90) -->
            <div class="ad active">
              <img
                src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQfHh75A0QbtQ0xs6kCdNjvg45U7HRBOaLGKQ&s"
                alt="Sponsored Ad 728x90"
                class="ad-banner" />
            </div>

            <!-- Medium rectangle (300x250) -->
            <div class="ad text-center">
              <img
                src="https://www.gourmetads.com/wp-content/uploads/2019/02/300x250-barilla.jpg.webp"
                alt="Sponsored Ad 300x250"
                class="ad-rectangle" />
            </div>

            <!-- Alternate leaderboard -->
            <div class="ad">
              <img
                src="https://publishers.gourmetads.com/wp-content/uploads/2021/08/bertolli-970x250-1.jpg"
                alt="Sponsored Ad Alternate"
                class="ad-banner" />
            </div>

          </div>
        </div>

        <!-- Footer -->
        <div class="loading-footer">
          <span>Loading results…</span>
          <span class="mono">RID: a1b2c3d4e5f6a7b8c9d0</span>
        </div>

      </div>
    </div>
  </div>

  <script>
    // Rotate sponsored images
    const ads = document.querySelectorAll('.ad');
    let adIndex = 0;

    setInterval(() => {
      ads[adIndex].classList.remove('active');
      adIndex = (adIndex + 1) % ads.length;
      ads[adIndex].classList.add('active');
    }, 4000);
  </script>

</body>
</html>
