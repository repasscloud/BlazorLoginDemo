{{ define "main" }}
<div class="td-content td-content--container">
  <div class="container">
    <h1>{{ .Title }}</h1>

    {{ if and (.Params.description) (ne .Params.show_description false) }}
      <p class="lead">{{ .Params.description }}</p>
    {{ end }}

    {{ .Content }}
  </div>
</div>
{{ end }}
