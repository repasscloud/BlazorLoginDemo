<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Weekday Picker – Styled Weekends</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Flatpickr -->
<link href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" rel="stylesheet">

<style>
body { background:#f8f9fa; }

.demo-card {
  max-width: 640px;
  margin: 60px auto;
}

/* Grey disabled days (like past days) */
.flatpickr-day.disabled,
.flatpickr-day.disabled:hover {
  background: #e9ecef !important;
  color: #adb5bd !important;
  cursor: not-allowed !important;
}

/* Optional: softer weekend highlight when enabled */
.flatpickr-day.weekend {
  background: #f8f9fa;
}
</style>
</head>

<body>

<div class="container">
  <div class="card shadow-sm demo-card">
    <div class="card-body">

      <h5 class="card-title mb-3">
        Weekday Picker (Grey Disabled Weekends)
      </h5>

      <!-- Controls -->
      <div class="row g-3 mb-4">

        <div class="col-md-4">
          <label class="form-label">Min days from today</label>
          <input id="minDays" type="number" class="form-control" value="0" min="0" max="365">
        </div>

        <div class="col-md-4 d-flex align-items-end">
          <div class="form-check">
            <input id="disableSat" class="form-check-input" type="checkbox" checked>
            <label class="form-check-label">Disable Saturday</label>
          </div>
        </div>

        <div class="col-md-4 d-flex align-items-end">
          <div class="form-check">
            <input id="disableSun" class="form-check-input" type="checkbox" checked>
            <label class="form-check-label">Disable Sunday</label>
          </div>
        </div>

      </div>

      <!-- Date -->
      <label class="form-label">Select Date</label>
      <input id="dateInput" class="form-control">

      <div class="mt-3">
        <div class="text-muted small">Selected</div>
        <div class="fw-semibold" id="output">None</div>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

<script>
const minDaysBox = document.getElementById("minDays");
const disableSat = document.getElementById("disableSat");
const disableSun = document.getElementById("disableSun");
const output = document.getElementById("output");

function getMinDate() {
  const d = new Date();
  d.setHours(0,0,0,0);
  d.setDate(d.getDate() + parseInt(minDaysBox.value || "0"));
  return d;
}

function buildDisableList() {
  const list = [];

  if (disableSat.checked) {
    list.push(date => date.getDay() === 6);
  }

  if (disableSun.checked) {
    list.push(date => date.getDay() === 0);
  }

  return list;
}

const fp = flatpickr("#dateInput", {
  dateFormat: "Y-m-d",
  minDate: getMinDate(),
  disable: buildDisableList(),

  onChange: function(selectedDates, dateStr) {
    output.textContent = dateStr || "None";
  },

  onDayCreate: function(dObj, dStr, fp, dayElem) {
    const day = dayElem.dateObj.getDay();
    if (day === 0 || day === 6) {
      dayElem.classList.add("weekend");
    }
  }
});

function refreshPicker() {
  fp.set("minDate", getMinDate());
  fp.set("disable", buildDisableList());
}

minDaysBox.addEventListener("input", refreshPicker);
disableSat.addEventListener("change", refreshPicker);
disableSun.addEventListener("change", refreshPicker);
</script>

</body>
</html>
